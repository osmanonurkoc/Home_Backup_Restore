name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set PSGallery as Trusted and Install ps2exe
      shell: powershell
      run: |
        Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
        Install-Module -Name ps2exe -Force -SkipPublisherCheck -Scope CurrentUser

    - name: Compile PowerShell to EXE
      shell: powershell
      run: |
        $buildArgs = @{
            inputFile   = ".\HomeBackup.ps1"
            outputFile  = ".\HomeBackup.exe"
            title       = "Home Backup & Restore"
            description = "Optimized Backup Utility"
            version     = "11.8.0"
        }
        
        if (Test-Path "icon.ico") {
            $buildArgs["icon"] = ".\icon.ico"
        }
        
        Invoke-ps2exe @buildArgs

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HomeBackup-Executable
        path: .\HomeBackup.exe

    - name: Create Release and Upload Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: .\HomeBackup.exe
        name: Release ${{ github.ref_name }}
        body: |
          ## 📂 Home Backup & Restore - Optimized Version
          
          This release includes the latest optimizations for storage efficiency and automated workflows.
          
          ### ✨ Key Features in this Build:
          * **📉 Low Space Mode:** Aggressive exclusions to save disk space.
          * **🗜️ Post-Backup Compression:** Automatic Zipping of backups.
          * **🔌 USB Auto-Run:** Plug-and-play backup detection.
          * **🔔 Toast Notifications:** Real-time background status updates.
          * **🛡️ Disk Guardian:** Pre-backup space checks.
          
          ---
          *Compiled automatically via GitHub Actions.*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
