name: Build Windows Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set PSGallery as Trusted and Install ps2exe
      shell: powershell
      run: |
        Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
        Install-Module -Name ps2exe -Force -SkipPublisherCheck -Scope CurrentUser

    - name: Compile PowerShell to EXE
      shell: powershell
      run: |
        $buildArgs = @{
            inputFile   = ".\HomeBackup.ps1"
            outputFile  = ".\HomeBackup.exe"
            title       = "Home Backup & Restore"
            description = "Optimized Backup Utility"
            version     = "11.8.0"
        }
        
        if (Test-Path "icon.ico") {
            $buildArgs["icon"] = ".\icon.ico"
        }
        
        Invoke-ps2exe @buildArgs

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HomeBackup-Executable
        path: .\HomeBackup.exe
